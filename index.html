<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal do Conhecimento | PPGs - EFLCH</title>

  <style>
    :root {
      --bg-dark: #0a0f18;
      --card-bg: #161d29;
      --border: #2d3748;
      --accent: #38bdf8;
      --text-bright: #e2e8f0;
      --text-dim: #94a3b8;
      --sidebar-width: 280px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-bright);
      margin: 0;
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── LOGIN ── */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      gap: 24px;
    }
    #login-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 360px;
      width: 90%;
    }
    #login-box h1 { font-size: 1.4rem; margin: 0; text-align: center; }
    #login-box h1 span { color: var(--accent); }
    #login-box p { color: var(--text-dim); font-size: 0.9rem; margin: 0; text-align: center; }
    #login-error {
      color: #f87171;
      font-size: 0.8rem;
      text-align: center;
      display: none;
    }

    /* ── APP ── */
    #app-screen { display: flex; width: 100%; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar-width);
      background: #0d131f;
      border-right: 1px solid var(--border);
      height: 100vh;
      position: fixed;
      padding: 20px;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      transition: transform 0.3s ease;
      overflow-y: auto;
    }
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 999;
    }

    .sidebar-actions { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }

    .btn-sidebar-action {
      background: rgba(56,189,248,0.1);
      color: var(--accent);
      border: 1px solid rgba(56,189,248,0.3);
      padding: 10px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
      width: 100%;
    }
    .btn-sidebar-action:hover { background: var(--accent); color: var(--bg-dark); }
    .btn-sidebar-action:disabled { opacity: 0.5; cursor: not-allowed; }

    .sidebar-title {
      color: var(--text-dim);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin: 15px 0 10px;
      padding-left: 5px;
    }

    /* PPG chips */
    #ppgChips {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-bottom: 20px;
    }
    .ppg-chip {
      font-size: 0.68rem; font-weight: 700;
      padding: 4px 10px; border-radius: 20px; cursor: pointer;
      border: 1px solid var(--border);
      background: transparent; color: var(--text-dim);
      transition: 0.2s; white-space: nowrap;
      letter-spacing: 0.3px;
    }
    .ppg-chip:hover { background: rgba(255,255,255,0.06); color: var(--text-bright); }
    .ppg-chip.active {
      background: rgba(56,189,248,0.15);
      border-color: rgba(56,189,248,0.4);
      color: var(--accent);
    }

    .sidebar-link {
      color: var(--text-bright);
      text-decoration: none;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 0.85rem;
      transition: 0.2s;
      cursor: pointer;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-link:hover { background: rgba(255,255,255,0.05); }
    .sidebar-link.active {
      background: rgba(56,189,248,0.15);
      color: var(--accent);
      font-weight: 600;
    }

    .cat-count {
      font-size: 0.65rem;
      font-weight: 700;
      background: rgba(56,189,248,0.12);
      color: var(--accent);
      border: 1px solid rgba(56,189,248,0.25);
      border-radius: 10px;
      padding: 1px 7px;
      min-width: 18px;
      text-align: center;
      display: none;
    }
    .cat-count.visible { display: inline-block; }
    .cat-count.zero { background: rgba(148,163,184,0.08); color: var(--text-dim); border-color: rgba(148,163,184,0.2); }

    .sidebar-user {
      margin-top: auto;
      padding-top: 15px;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-dim);
      word-break: break-all;
    }
    .sidebar-user strong { display: block; color: var(--text-bright); margin-bottom: 4px; }
    .btn-logout {
      margin-top: 8px;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.7rem;
      cursor: pointer;
      width: 100%;
    }
    .btn-logout:hover { border-color: #f87171; color: #f87171; }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--accent);
      font-size: 1.8rem;
      cursor: pointer;
      padding: 0;
      margin-right: 15px;
    }

    /* ── MAIN ── */
    .main-wrapper {
      margin-left: var(--sidebar-width);
      flex: 1;
      padding: 20px 40px;
      width: 100%;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 15px;
      margin-bottom: 30px;
    }
    .brand-container { display: flex; align-items: center; gap: 10px; }
    .brand h1 { font-size: 1.1rem; margin: 0; }
    .brand h1 span { color: var(--accent); }

    #status-bar {
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-bottom: 8px;
      min-height: 18px;
    }
    #status-bar.loading { color: var(--accent); }
    #status-bar.error   { color: #f87171; }

    #searchInput {
      width: 100%;
      padding: 15px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      margin-bottom: 15px;
      outline: none;
    }

    .active-filters-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 30px;
      align-items: center;
      min-height: 40px;
    }
    .filter-label { font-size: 0.8rem; font-weight: 700; color: var(--accent); }
    .filter-badge {
      background: rgba(56,189,248,0.1);
      border: 1px solid rgba(56,189,248,0.2);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.7rem;
      display: flex; align-items: center; gap: 8px;
    }

    /* ── CARDS ── */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      display: flex; flex-direction: column;
      transition: 0.3s;
    }
    .card:hover { transform: translateY(-5px); border-color: var(--accent); }

    .category-tag { font-size: 0.6rem; font-weight: 800; padding: 3px 10px; border-radius: 50px; text-transform: uppercase; }
    .tag-flow      { background: rgba(16,185,129,0.1);  color: #10b981; }
    .tag-system    { background: rgba(139,92,246,0.1);  color: #8b5cf6; }
    .tag-normative { background: rgba(245,158,11,0.1);  color: #f59e0b; }
    .tag-process   { background: rgba(59,130,246,0.1);  color: #3b82f6; }
    .tag-dashboard { background: rgba(236,72,153,0.1);  color: #ec4899; }
    .tag-tutorial  { background: rgba(6,182,212,0.1);   color: #06b6d4; }

    /* ── PROCESS CARDS ── */
    .card-process-ativo {
      background: linear-gradient(135deg, #161d29 0%, #162030 100%);
      border: 1px solid #1e3a5f !important;
      border-top: 3px solid #10b981 !important;
    }
    .card-process-ativo:hover { border-color: #10b981 !important; box-shadow: 0 8px 24px rgba(16,185,129,0.15); }

    .card-process-inativo {
      background: #111720;
      border: 1px solid #1e2535 !important;
      border-top: 3px solid #374151 !important;
      opacity: 0.75;
    }
    .card-process-inativo:hover { opacity: 1; border-color: #4b5563 !important; }

    .sei-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(0,183,183,0.12); border: 1px solid rgba(0,183,183,0.3);
      border-radius: 8px; padding: 4px 10px;
      font-size: 0.7rem; font-weight: 800; color: #00b7b7;
      letter-spacing: 0.5px;
    }
    .sei-badge svg { width: 20px; height: 20px; flex-shrink: 0; }

    .status-badge {
      display: inline-flex; align-items: center; gap: 4px;
      border-radius: 20px; padding: 3px 10px;
      font-size: 0.6rem; font-weight: 800; letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .status-ativo   { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
    .status-inativo { background: rgba(100,116,139,0.15); color: #64748b; border: 1px solid rgba(100,116,139,0.3); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; position: relative; }
    .status-ativo .status-dot   { background: #10b981; animation: pulse-green 1.8s ease-in-out infinite; }
    .status-inativo .status-dot { background: #64748b; }

    @keyframes pulse-green {
      0%   { box-shadow: 0 0 0 0 rgba(16,185,129,0.7); }
      70%  { box-shadow: 0 0 0 6px rgba(16,185,129,0); }
      100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
    }

    .archived-header {
      display: flex; align-items: center; gap: 10px;
      color: var(--text-dim); margin-top: 36px; margin-bottom: 16px;
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px;
    }
    .archived-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .keyword-container { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 15px; }
    .keyword-tag { font-size: 0.6rem; color: var(--text-dim); border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; }

    .btn-view {
      text-decoration: none; text-align: center; padding: 12px; border-radius: 8px;
      font-size: 0.75rem; font-weight: 700; border: 1px solid; margin-top: 20px;
    }

    footer { margin-top: 60px; padding: 40px; border-top: 1px solid var(--border); text-align: center; font-size: 0.8rem; color: var(--text-dim); }

    @media (max-width: 1024px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.visible { display: block; }
      .main-wrapper { margin-left: 0; padding: 15px; }
      .menu-toggle { display: block; }
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════════
     APP PRINCIPAL
════════════════════════════════════════════════════════════ -->
<div id="app-screen">

  <div id="overlay" class="sidebar-overlay" onclick="toggleMenu()"></div>

  <nav id="sidebar" class="sidebar">
    <div class="sidebar-actions">
      <button class="btn-sidebar-action" id="btn-refresh" onclick="refreshDados()">🔄 Atualizar Dados</button>
      <button class="btn-sidebar-action" onclick="resetAllFilters()">🧹 Redefinir Filtros</button>
    </div>

    <div class="sidebar-title">Filtro por PPG</div>
    <div id="ppgChips">
      <button class="ppg-chip active" data-ppg="all" onclick="setPPG('all')">Todos</button>
      <button class="ppg-chip" data-ppg="geral" onclick="setPPG('geral')">Geral</button>
    </div>

    <div class="sidebar-title">Categorias</div>
    <a onclick="setCategory('all')"       id="btn-all"       class="sidebar-link active">🏠 Ver Tudo    <span class="cat-count" id="count-all"></span></a>
    <a onclick="setCategory('fluxo')"     id="btn-fluxo"     class="sidebar-link">🌊 Fluxos      <span class="cat-count" id="count-fluxo"></span></a>
    <a onclick="setCategory('sistema')"   id="btn-sistema"   class="sidebar-link">💻 Sistemas    <span class="cat-count" id="count-sistema"></span></a>
    <a onclick="setCategory('dashboard')" id="btn-dashboard" class="sidebar-link">📊 Dashboards  <span class="cat-count" id="count-dashboard"></span></a>
    <a onclick="setCategory('tutorial')"  id="btn-tutorial"  class="sidebar-link">📖 Tutoriais   <span class="cat-count" id="count-tutorial"></span></a>
    <a onclick="setCategory('normativo')" id="btn-normativo" class="sidebar-link">📜 Normativos  <span class="cat-count" id="count-normativo"></span></a>
    <a onclick="setCategory('processo')"  id="btn-processo"  class="sidebar-link">📁 Processos   <span class="cat-count" id="count-processo"></span></a>

  </nav>

  <div class="main-wrapper">
    <header>
      <button class="menu-toggle" onclick="toggleMenu()">☰</button>
      <div class="brand-container">
        <div class="brand">
          <h1>Portal do Conhecimento<span> | PPGs - EFLCH</span></h1>
        </div>
      </div>
    </header>

    <div id="status-bar"></div>
    <input type="text" id="searchInput" onkeyup="filter()" placeholder="Busque por título ou palavras-chave...">
    <div id="activeFilters" class="active-filters-bar"></div>
    <div id="content-area"></div>
    <footer>
      &copy; 2026 UNIFESP | EFLCH | Desenvolvido por Mauricio Massao Oura
      <br><br>
      <a href="https://docs.google.com/spreadsheets/d/1GXiIW2zvLJXGxnFMgTKCftvkg4V872uHjvX1Umci1hQ/edit"
         target="_blank"
         style="color:var(--accent);text-decoration:none;font-size:0.75rem;opacity:0.7;transition:opacity 0.2s"
         onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.7">
        📊 Planilha fonte de dados
      </a>
    </footer>
  </div>

</div>

<script>
// ══════════════════════════════════════════════════════════════
//  CONFIGURAÇÃO
// ══════════════════════════════════════════════════════════════
const SECOES_CONFIG = [
  { id: 'fluxo',      titulo: 'Fluxos',      arquivo: 'fluxos.json',      tagClass: 'tag-flow'      },
  { id: 'sistema',    titulo: 'Sistemas',     arquivo: 'sistemas.json',    tagClass: 'tag-system'    },
  { id: 'dashboard',  titulo: 'Dashboards',   arquivo: 'dashboards.json',  tagClass: 'tag-dashboard' },
  { id: 'tutorial',   titulo: 'Tutoriais',    arquivo: 'tutoriais.json',   tagClass: 'tag-tutorial'  },
  { id: 'normativo',  titulo: 'Normativos',   arquivo: 'normativos.json',  tagClass: 'tag-normative' },
  { id: 'processo',   titulo: 'Processos',    arquivo: 'processos.json',   tagClass: 'tag-process'   },
];

window.addEventListener('load', () => carregarDados());

// ══════════════════════════════════════════════════════════════
//  DADOS — lê JSONs locais do repositório
// ══════════════════════════════════════════════════════════════
function setStatus(msg, tipo = '') {
  const el = document.getElementById('status-bar');
  el.textContent = msg;
  el.className = tipo;
}

async function carregarDados() {
  document.getElementById('content-area').innerHTML =
    '<p style="text-align:center;padding:60px;color:var(--text-dim)">Carregando...</p>';

  const dados = { secoes: [] };
  let erros = 0;

  await Promise.all(SECOES_CONFIG.map(async cfg => {
    try {
      const resp = await fetch(`${cfg.arquivo}?v=${Date.now()}`);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const itens = await resp.json();
      dados.secoes.push({ id: cfg.id, titulo: cfg.titulo, tagClass: cfg.tagClass, itens });
    } catch (e) {
      erros++;
      console.error(`Erro ao carregar ${cfg.arquivo}:`, e);
    }
  }));

  // Reordena conforme SECOES_CONFIG
  dados.secoes.sort((a, b) =>
    SECOES_CONFIG.findIndex(c => c.id === a.id) - SECOES_CONFIG.findIndex(c => c.id === b.id)
  );

  if (erros === SECOES_CONFIG.length) {
    setStatus('❌ Erro ao carregar dados. Verifique os arquivos JSON.', 'error');
    return;
  }

  setStatus('');
  renderizarTudo(dados);
}

async function refreshDados() {
  const btn = document.getElementById('btn-refresh');
  btn.disabled = true;
  btn.textContent = '⏳ Atualizando...';
  await carregarDados();
  btn.disabled = false;
  btn.textContent = '🔄 Atualizar Dados';
}

// ══════════════════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════════════════
let secoes = [];
let currentCategory = 'all';
let currentPPG = 'all';

function renderizarTudo(dados) {
  secoes = dados.secoes || [];
  const container = document.getElementById('content-area');
  const ppgsFound = new Set();
  let   fullHtml  = '';

  secoes.forEach(sec => {
    sec.itens.forEach(item => {
      const p = (item.ppg || '').trim().toLowerCase();
      if (p && p !== 'geral' && p !== 'todos') ppgsFound.add(p);
    });

    let conteudo;
    if (sec.id === 'processo') {
      const ativos   = sec.itens.filter(i => i.status === 'ativo');
      const inativos = sec.itens.filter(i => i.status !== 'ativo');
      conteudo = `
        <div class="grid-container">${renderCards(ativos, sec.tagClass, sec.titulo)}</div>
        <div class="archived-header">📦 Arquivados (${inativos.length})</div>
        <div class="grid-container">${renderCards(inativos, sec.tagClass, sec.titulo)}</div>`;
    } else {
      conteudo = `<div class="grid-container">${renderCards(sec.itens, sec.tagClass, sec.titulo)}</div>`;
    }

    fullHtml += `
      <div class="section-block" id="sec-${sec.id}">
        <h2 style="color:var(--accent);font-size:1rem;text-transform:uppercase;margin:40px 0 20px">${sec.titulo}</h2>
        ${conteudo}
      </div>`;
  });

  // Reconstrói chips de PPG
  const chipsContainer = document.getElementById('ppgChips');
  const prevPPG = currentPPG;
  chipsContainer.innerHTML =
    `<button class="ppg-chip${prevPPG==='all'?' active':''}" data-ppg="all" onclick="setPPG('all')">Todos</button>` +
    `<button class="ppg-chip${prevPPG==='geral'?' active':''}" data-ppg="geral" onclick="setPPG('geral')">Geral</button>`;
  Array.from(ppgsFound).sort().forEach(p => {
    const active = prevPPG === p ? ' active' : '';
    chipsContainer.innerHTML += `<button class="ppg-chip${active}" data-ppg="${p}" onclick="setPPG('${p}')">${p.toUpperCase()}</button>`;
  });
  if (!ppgsFound.has(prevPPG) && prevPPG !== 'geral') currentPPG = 'all';

  container.innerHTML = fullHtml;
  filter();
}

const SEI_ICON = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="24" height="24" rx="5" fill="#00b7b7"/>
  <text x="12" y="17" font-family="Arial,sans-serif" font-size="9" font-weight="900"
        fill="white" text-anchor="middle">sei!</text>
</svg>`;

function renderCards(lista, tagClass, categoriaTitulo) {
  if (!lista.length) return '<p style="color:var(--text-dim);font-size:0.85rem;padding:10px 0">Nenhum item.</p>';

  return lista.map(item => {
    const ppgOriginal = item.ppg || 'Geral';
    const ppgCor      = getPPGColor(ppgOriginal);
    const isProc      = tagClass === 'tag-process';
    const isAtivo     = String(item.status).toLowerCase() === 'ativo';

    const kwHtml = item.palavras_chave
      ? `<div class="keyword-container">${
          String(item.palavras_chave).split(',')
            .map(t => `<span class="keyword-tag">#${t.trim()}</span>`).join('')
        }</div>`
      : '';

    const procClass = isProc ? (isAtivo ? ' card-process-ativo' : ' card-process-inativo') : '';
    const borderStyle = isProc ? '' : `border-top:4px solid ${ppgCor}`;

    const topRight = isProc
      ? `<span class="sei-badge">${SEI_ICON} SEI</span>`
      : `<span style="font-size:0.6rem;color:${ppgCor};border:1px solid ${ppgCor};padding:1px 6px;border-radius:4px;font-weight:bold">${ppgOriginal.toUpperCase()}</span>`;

    const statusHtml = isProc
      ? `<div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px">
           <span class="status-badge ${isAtivo ? 'status-ativo' : 'status-inativo'}">
             <span class="status-dot"></span>${isAtivo ? 'Ativo' : 'Arquivado'}
           </span>
           <span style="font-size:0.6rem;color:${ppgCor};border:1px solid ${ppgCor};padding:1px 6px;border-radius:4px;font-weight:bold">${ppgOriginal.toUpperCase()}</span>
         </div>`
      : '';

    const btnColor = isProc ? (isAtivo ? '#10b981' : '#64748b') : ppgCor;

    return `
      <div class="card${procClass}" data-ppg="${ppgOriginal.toLowerCase()}"
           style="${borderStyle}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <span class="category-tag ${tagClass}">${categoriaTitulo.slice(0,-1)}</span>
          ${topRight}
        </div>
        <h3 style="margin:10px 0;font-size:1.1rem">${item.titulo}</h3>
        <p style="font-size:0.85rem;color:var(--text-dim);flex-grow:1">${item.descricao || ''}</p>
        ${statusHtml}
        ${kwHtml}
        <a href="${item.link}" class="btn-view" target="_blank"
           style="border-color:${btnColor};color:${btnColor}">${isProc ? 'ABRIR NO SEI' : 'ABRIR'}</a>
      </div>`;
  }).join('');
}

// ══════════════════════════════════════════════════════════════
//  FILTROS
// ══════════════════════════════════════════════════════════════
function normalize(str) {
  return (str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function matchesSearch(text, query) {
  const hay   = normalize(text);
  const terms = normalize(query).trim().split(/\s+/).filter(Boolean);
  return terms.every(t => hay.includes(t));
}

function setPPG(val) {
  currentPPG = val;
  document.querySelectorAll('.ppg-chip').forEach(c =>
    c.classList.toggle('active', c.dataset.ppg === val)
  );
  maybeCloseMenu();
  filter();
}

function filter() {
  const rawQuery    = document.getElementById('searchInput').value;
  const selPPG      = currentPPG;
  const sections    = document.querySelectorAll('.section-block');
  const isFiltering = rawQuery.trim() !== '' || selPPG !== 'all';
  const counts      = {};
  let   totalCount  = 0;

  sections.forEach(section => {
    const sectionId = section.id.replace('sec-', '');
    const cards     = section.querySelectorAll('.card');
    let visibleInSection = 0;
    let hasVisible = false;
    const isActive = currentCategory === 'all' || currentCategory === sectionId;

    cards.forEach(card => {
      const cardPPG = (card.getAttribute('data-ppg') || '').toLowerCase();
      const matchesPPG =
        selPPG === 'all'   ? true :
        selPPG === 'geral' ? cardPPG === 'geral' :
                             cardPPG === selPPG;
      const searchOk = !rawQuery.trim() || matchesSearch(card.innerText, rawQuery);

      if (matchesPPG && searchOk) {
        visibleInSection++;
        if (isActive) { card.style.display = ''; hasVisible = true; }
        else            card.style.display = 'none';
      } else {
        card.style.display = 'none';
      }
    });

    section.style.display = (isActive && hasVisible) ? '' : 'none';
    counts[sectionId] = visibleInSection;
    totalCount += visibleInSection;
  });

  // Badges do sidebar
  secoes.forEach(sec => {
    const badge = document.getElementById('count-' + sec.id);
    if (!badge) return;
    const n = counts[sec.id] || 0;
    if (isFiltering) {
      badge.textContent = n;
      badge.classList.add('visible');
      badge.classList.toggle('zero', n === 0);
    } else {
      badge.classList.remove('visible');
    }
  });

  const badgeAll = document.getElementById('count-all');
  if (badgeAll) {
    if (isFiltering) {
      badgeAll.textContent = totalCount;
      badgeAll.classList.add('visible');
      badgeAll.classList.toggle('zero', totalCount === 0);
    } else {
      badgeAll.classList.remove('visible');
    }
  }

  updateFilterBadges();
}

function setCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  document.getElementById('btn-' + cat).classList.add('active');
  maybeCloseMenu();
  filter();
}

function resetAllFilters() {
  document.getElementById('searchInput').value = '';
  setPPG('all');
  setCategory('all');
}

function updateFilterBadges() {
  const bar    = document.getElementById('activeFilters');
  const ppg    = currentPPG;
  const search = document.getElementById('searchInput').value;
  let html = '';
  if (ppg !== 'all' || currentCategory !== 'all' || search !== '') {
    html = '<span class="filter-label">Filtros:</span>';
    if (ppg !== 'all')             html += `<div class="filter-badge">${ppg.toUpperCase()}</div>`;
    if (currentCategory !== 'all') html += `<div class="filter-badge">${currentCategory.toUpperCase()}</div>`;
    if (search)                    html += `<div class="filter-badge">"${search}"</div>`;
  }
  bar.innerHTML = html;
}

// ══════════════════════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════════════════════
function toggleMenu() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('visible');
}
function maybeCloseMenu() {
  if (window.innerWidth <= 1024) toggleMenu();
}
function getPPGColor(ppg) {
  const lower = (ppg || '').toLowerCase();
  if (!ppg || lower === 'geral' || lower === 'todos') return '#94a3b8';
  const colors = ['#38bdf8','#10b981','#818cf8','#fbbf24','#2dd4bf','#6366f1'];
  let hash = 0;
  for (let i = 0; i < ppg.length; i++) hash = ppg.charCodeAt(i) + ((hash << 5) - hash);
  return colors[Math.abs(hash) % colors.length];
}

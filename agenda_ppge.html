<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma de Atividades - PPGE</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7fafc;
            margin: 0;
            padding: 20px;
            color: #2d3748;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        h1 {
            text-align: center;
            color: #1a365d;
            margin-bottom: 5px;
            font-size: 26px;
        }
        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .gantt-scroll-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #fff;
        }
        #gantt_chart {
            min-width: 1100px;
            min-height: 400px;
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 16px;
            color: #a0aec0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Cronograma de Atividades PPGE</h1>
    <div class="subtitle">Gráfico de Gantt dinâmico atualizado via GitHub JSON</div>
    
    <div class="gantt-scroll-container">
        <div id="gantt_chart">
            <div class="loading">Carregando dados estruturados do cronograma...</div>
        </div>
    </div>
</div>

<script type="text/javascript">
    google.charts.load('current', {'packages':['gantt'], 'language': 'pt-br'});
    google.charts.setOnLoadCallback(carregarEventosJSON);

    function carregarEventosJSON() {
        // Como o JSON estará na mesma pasta do repositório que o HTML, basta ler o arquivo direto
        const arquivoJSON = "agenda.json";

        fetch(arquivoJSON)
            .then(response => {
                if (!response.ok) throw new Error('Arquivo de dados não encontrado ou ainda não gerado.');
                return response.json();
            })
            .then(eventos => {
                renderizarGrafico(eventos);
            })
            .catch(error => {
                document.getElementById('gantt_chart').innerHTML = 
                    `<p style="color:#e53e3e; text-align:center; padding: 40px;">
                        Erro ao carregar os dados do cronograma.<br>
                        <small>Certifique-se de executar a sincronização na planilha pelo menos uma vez para criar o arquivo "agenda.json".</small>
                    </p>`;
                console.error(error);
            });
    }

    function converterParaData(stringData) {
        if (!stringData) return null;
        
        // Trata formato YYYY-MM-DD gerado pelo script
        if (stringData.includes('-')) {
            const partes = stringData.split('-');
            if (partes.length === 3) {
                return new Date(parseInt(partes[0], 10), parseInt(partes[1], 10) - 1, parseInt(partes[2], 10));
            }
        }
        
        // Tratamento de segurança caso o dado venha como DD/MM/YYYY
        if (stringData.includes('/')) {
            const partes = stringData.split('/');
            if (partes.length === 3) {
                return new Date(parseInt(partes[2], 10), parseInt(partes[1], 10) - 1, parseInt(partes[0], 10));
            }
        }
        return null;
    }

    function renderizarGrafico(eventos) {
        var dataTable = new google.visualization.DataTable();
        dataTable.addColumn('string', 'Task ID');
        dataTable.addColumn('string', 'Task Name');
        dataTable.addColumn('string', 'Resource');
        dataTable.addColumn('date', 'Start Date');
        dataTable.addColumn('date', 'End Date');
        dataTable.addColumn('number', 'Duration');
        dataTable.addColumn('number', 'Percent Complete');
        dataTable.addColumn('string', 'Dependencies');

        let idContador = 1;

        eventos.forEach(item => {
            const txtDataInic = item["DIA INICIAL"];
            const txtDataFim = item["DIA FINAL"];
            const categoria = item["Categoria"] || "Geral";
            const evento = item["EVENTO"];

            if (!txtDataInic || !evento) return;

            const dataInicio = converterParaData(txtDataInic);
            const dataFim = converterParaData(txtDataFim);

            if (dataInicio && !isNaN(dataInicio.getTime()) && dataFim && !isNaN(dataFim.getTime())) {
                dataTable.addRow([
                    'T' + idContador, 
                    String(evento).trim(),              
                    String(categoria).trim(),           
                    dataInicio,           
                    dataFim,             
                    null,                
                    0,                   
                    null                 
                ]);
                idContador++;
            }
        });

        if (idContador === 1) {
            document.getElementById('gantt_chart').innerHTML = 
                `<p style="text-align:center; padding:40px; color:#718096;">Nenhum dado válido foi encontrado dentro do arquivo agenda.json.</p>`;
            return;
        }

        const alturaCalculada = (idContador * 42) + 60;
        document.getElementById('gantt_chart').style.height = alturaCalculada + 'px';

        const opcoesVisuais = {
            height: alturaCalculada,
            gantt: {
                trackHeight: 38,
                barHeight: 24,
                percentEnabled: false,
                palette: [
                    { "color": "#3182ce", "dark": "#2b6cb0", "light": "#ebf8ff" }, // Azul
                    { "color": "#319795", "dark": "#2c7a7b", "light": "#e6fffa" }, // Teal
                    { "color": "#d69e2e", "dark": "#b7791f", "light": "#fefcbf" }, // Amarelo
                    { "color": "#805ad5", "dark": "#6b46c1", "light": "#faf5ff" }, // Roxo
                    { "color": "#38a169", "dark": "#2f855a", "light": "#f0fff4" }, // Verde
                    { "color": "#e53e3e", "dark": "#c53030", "light": "#fff5f5" }  // Vermelho
                ]
            }
        };

        const chart = new google.visualization.Gantt(document.getElementById('gantt_chart'));
        chart.draw(dataTable, opcoesVisuais);
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma de Atividades - PPGE</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7fafc;
            margin: 0;
            padding: 20px;
            color: #2d3748;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        h1 {
            text-align: center;
            color: #1a365d;
            margin-bottom: 5px;
            font-size: 26px;
        }
        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .gantt-scroll-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #fff;
        }
        #gantt_chart {
            min-width: 1100px;
            min-height: 650px;
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 16px;
            color: #a0aec0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Cronograma de Atividades PPGE</h1>
    <div class="subtitle">Gráfico de Gantt dinâmico atualizado via Google Sheets</div>
    
    <div class="gantt-scroll-container">
        <div id="gantt_chart">
            <div class="loading">Carregando e processando dados da agenda pública...</div>
        </div>
    </div>
</div>

<script type="text/javascript">
    // Inicializa o Google Charts para o formato Gantt
    google.charts.load('current', {'packages':['gantt'], 'language': 'pt-br'});
    google.charts.setOnLoadCallback(fetchData);

    function fetchData() {
        // ID original da planilha que você separou para a agenda
        const spreadsheetId = '11gYJqlhSULjWt6hAExmIyWKprE43uB7fybmx7osr-z8';
        // Nome exato da aba
        const sheetName = encodeURIComponent('agenda_ppge');
        
        // Endpoint oficial para puxar dados estruturados diretamente da planilha aberta
        const url = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?sheet=${sheetName}`;

        const query = new google.visualization.Query(url);
        query.send(handleQueryResponse);
    }

    function handleQueryResponse(response) {
        if (response.isError()) {
            document.getElementById('gantt_chart').innerHTML = 
                `<p style="color:#e53e3e; text-align:center; padding: 40px;">
                    Erro ao carregar dados da planilha.<br>
                    <small>${response.getMessage()} - ${response.getDetailedMessage()}</small>
                </p>`;
            return;
        }

        const dt = response.getDataTable();
        const totalRows = dt.getNumberOfRows();

        var data = new google.visualization.DataTable();
        data.addColumn('string', 'Task ID');
        data.addColumn('string', 'Task Name');
        data.addColumn('string', 'Resource');
        data.addColumn('date', 'Start Date');
        data.addColumn('date', 'End Date');
        data.addColumn('number', 'Duration');
        data.addColumn('number', 'Percent Complete');
        data.addColumn('string', 'Dependencies');

        let taskIdCounter = 1;

        for (let i = 0; i < totalRows; i++) {
            // Mapeamento automático das colunas do Google Sheets:
            // Coluna 0 (A): DIA INICIAL | Coluna 1 (B): DIA FINAL | Coluna 2 (C): Categoria | Coluna 3 (D): EVENTO
            let valDataInicial = dt.getValue(i, 0);
            let valDataFinal = dt.getValue(i, 1);
            let categoria = dt.getValue(i, 2) || 'Geral';
            let evento = dt.getValue(i, 3) || '';

            if (!valDataInicial || !valDataFinal) continue;

            let startDate, endDate;

            // Garante a conversão correta seja ela string ou objeto Date nativo do Google
            if (valDataInicial instanceof Date) {
                startDate = valDataInicial;
            } else {
                const pStart = String(valDataInicial).split('-');
                if(pStart.length !== 3) continue;
                startDate = new Date(parseInt(pStart[0]), parseInt(pStart[1]) - 1, parseInt(pStart[2]));
            }

            if (valDataFinal instanceof Date) {
                endDate = valDataFinal;
            } else {
                const pEnd = String(valDataFinal).split('-');
                if(pEnd.length !== 3) continue;
                endDate = new Date(parseInt(pEnd[0]), parseInt(pEnd[1]) - 1, parseInt(pEnd[2]));
            }

            // Ignora a linha de cabeçalho se ela for lida textualmente
            if (evento === "EVENTO" || categoria === "Categoria" || String(valDataInicial).includes("DIA")) continue;

            data.addRow([
                'T' + taskIdCounter, 
                evento,              
                categoria,           
                startDate,           
                endDate,             
                null,                
                0,                   
                null                 
            ]);
            taskIdCounter++;
        }

        const options = {
            height: taskIdCounter * 38 + 60, // Ajusta a altura perfeitamente ao número de tarefas existentes
            gantt: {
                trackHeight: 35,
                barHeight: 22,
                percentEnabled: false,
                palette: [
                    { "color": "#3182ce", "dark": "#2b6cb0", "light": "#ebf8ff" }, // Azul
                    { "color": "#319795", "dark": "#2c7a7b", "light": "#e6fffa" }, // Teal
                    { "color": "#d69e2e", "dark": "#b7791f", "light": "#fefcbf" }, // Amarelo
                    { "color": "#805ad5", "dark": "#6b46c1", "light": "#faf5ff" }, // Roxo
                    { "color": "#38a169", "dark": "#2f855a", "light": "#f0fff4" }, // Verde
                    { "color": "#e53e3e", "dark": "#c53030", "light": "#fff5f5" }  // Vermelho
                ]
            }
        };

        const chart = new google.visualization.Gantt(document.getElementById('gantt_chart'));
        chart.draw(data, options);
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma de Atividades - PPGE</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7fafc;
            margin: 0;
            padding: 20px;
            color: #2d3748;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        h1 {
            text-align: center;
            color: #1a365d;
            margin-bottom: 5px;
            font-size: 26px;
        }
        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .gantt-scroll-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #fff;
        }
        #gantt_chart {
            min-width: 1100px;
            min-height: 400px;
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 16px;
            color: #a0aec0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Cronograma de Atividades PPGE</h1>
    <div class="subtitle">Gráfico de Gantt dinâmico atualizado via Google Sheets</div>
    
    <div class="gantt-scroll-container">
        <div id="gantt_chart">
            <div class="loading">Carregando e processando dados da agenda pública...</div>
        </div>
    </div>
</div>

<script type="text/javascript">
    // Inicializa a biblioteca de gráficos do Google
    google.charts.load('current', {'packages':['gantt'], 'language': 'pt-br'});
    google.charts.setOnLoadCallback(baixarDadosPlanilha);

    function baixarDadosPlanilha() {
        // ID definitivo da sua planilha
        const spreadsheetId = "11gYJqlhSULjWt6hAExmIyWKprE43uB7fybmx7osr-z8";
        
        // Usamos o endpoint gviz que o próprio motor do Google Charts usa para tabelas nativas
        const urlGviz = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:csv&gid=0`;

        // Executa a requisição usando o objeto seguro do Google, contornando erros de CORS
        const query = new google.visualization.Query(urlGviz);
        query.send(handleQueryResponse);
    }

    function handleQueryResponse(response) {
        if (response.isError()) {
            document.getElementById('gantt_chart').innerHTML = 
                `<p style="color:#e53e3e; text-align:center; padding: 40px;">
                    Erro ao se comunicar com o Google Sheets.<br>
                    <small>${response.getMessage()} - ${response.getDetailedMessage()}</small>
                </p>`;
            return;
        }

        // Se a requisição deu certo, pegamos o objeto de dados nativo estruturado pelo Google
        const dt = response.getDataTable();
        const totalLinhas = dt.getNumberOfRows();

        var dataTable = new google.visualization.DataTable();
        dataTable.addColumn('string', 'Task ID');
        dataTable.addColumn('string', 'Task Name');
        dataTable.addColumn('string', 'Resource');
        dataTable.addColumn('date', 'Start Date');
        dataTable.addColumn('date', 'End Date');
        dataTable.addColumn('number', 'Duration');
        dataTable.addColumn('number', 'Percent Complete');
        dataTable.addColumn('string', 'Dependencies');

        let idContador = 1;

        for (let i = 0; i < totalLinhas; i++) {
            // Mapeamento direto das células do Google Sheets:
            // Coluna 0 (A): DIA INICIAL | Coluna 1 (B): DIA FINAL | Coluna 2 (C): Categoria | Coluna 3 (D): EVENTO
            let valDataInicial = dt.getValue(i, 0);
            let valDataFinal = dt.getValue(i, 1);
            let categoria = dt.getValue(i, 2);
            let evento = dt.getValue(i, 3);

            if (!valDataInicial || !valDataFinal) continue;

            let dataInicio = converterParaData(valDataInicial);
            let dataFim = converterParaData(valDataFinal);

            // Ignora o cabeçalho se ele for lido textualmente
            if (!dataInicio || !dataFim || String(evento).toUpperCase().includes("EVENTO")) continue;

            dataTable.addRow([
                'T' + idContador, 
                String(evento).trim(),              
                categoria ? String(categoria).trim() : 'Geral',           
                dataInicio,           
                dataFim,             
                null,                
                0,                   
                null                 
            ]);
            idContador++;
        }

        if (idContador === 1) {
            document.getElementById('gantt_chart').innerHTML = 
                `<p style="text-align:center; padding:40px; color:#718096;">Nenhum dado pôde ser processado. Verifique as datas na planilha.</p>`;
            return;
        }

        // Calcula a altura ideal do container do gráfico
        const alturaCalculada = (idContador * 42) + 60;
        document.getElementById('gantt_chart').style.height = alturaCalculada + 'px';

        const opcoesVisuais = {
            height: alturaCalculada,
            gantt: {
                trackHeight: 38,
                barHeight: 24,
                percentEnabled: false,
                palette: [
                    { "color": "#3182ce", "dark": "#2b6cb0", "light": "#ebf8ff" }, // Azul
                    { "color": "#319795", "dark": "#2c7a7b", "light": "#e6fffa" }, // Teal
                    { "color": "#d69e2e", "dark": "#b7791f", "light": "#fefcbf" }, // Amarelo
                    { "color": "#805ad5", "dark": "#6b46c1", "light": "#faf5ff" }, // Roxo
                    { "color": "#38a169", "dark": "#2f855a", "light": "#f0fff4" }, // Verde
                    { "color": "#e53e3e", "dark": "#c53030", "light": "#fff5f5" }  // Vermelho
                ]
            }
        };

        const chart = new google.visualization.Gantt(document.getElementById('gantt_chart'));
        chart.draw(dataTable, opcoesVisuais);
    }

    // Conversor capaz de lidar tanto com objetos de data nativos do Google quanto com strings textuais (BR ou ISO)
    function converterParaData(valor) {
        if (!valor) return null;
        if (valor instanceof Date) return valor;

        let stringData = String(valor).replace(/[\u200B-\u200D\uFEFF]/g, "").trim();

        if (stringData.includes('/')) {
            const partes = stringData.split('/');
            if (partes.length === 3) {
                return new Date(parseInt(partes[2], 10), parseInt(partes[1], 10) - 1, parseInt(partes[0], 10));
            }
        }
        
        if (stringData.includes('-')) {
            const partes = stringData.split('-');
            if (partes.length === 3) {
                return new Date(parseInt(partes[0], 10), parseInt(partes[1], 10) - 1, parseInt(partes[2], 10));
            }
        }

        return null;
    }
</script>

</body>
</html>

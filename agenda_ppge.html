<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma de Atividades - PPGE</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7fafc;
            margin: 0;
            padding: 20px;
            color: #2d3748;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        h1 {
            text-align: center;
            color: #1a365d;
            margin-bottom: 5px;
            font-size: 26px;
        }
        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .gantt-scroll-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #fff;
        }
        #gantt_chart {
            min-width: 1100px;
            min-height: 650px;
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 16px;
            color: #a0aec0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Cronograma de Atividades PPGE</h1>
    <div class="subtitle">Gráfico de Gantt dinâmico atualizado via Google Sheets</div>
    
    <div class="gantt-scroll-container">
        <div id="gantt_chart">
            <div class="loading">Carregando e processando dados da agenda pública...</div>
        </div>
    </div>
</div>

<script type="text/javascript">
    // Inicializa o Google Charts para o formato Gantt
    google.charts.load('current', {'packages':['gantt'], 'language': 'pt-br'});
    google.charts.setOnLoadCallback(baixarDadosCSV);

    function baixarDadosCSV() {
        // Link de publicação em formato CSV que você gerou
        const urlCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRlYhmbrQDLeT0KGj45EeXRMMwZfyO5vI4lBYB3WK0C_LiTxOsfE0IUwF6UgNrhMgpm-mUvTJNqg4E_/pub?gid=0&single=true&output=csv";

        // Usamos um proxy gratuito e confiável (allorigins) apenas para contornar o bloqueio de CORS do navegador em arquivos locais/Git
        fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(urlCSV)}`)
            .then(response => {
                if (response.ok) return response.json();
                throw new Error('Erro na conexão de rede.');
            })
            .then(data => {
                processarCSV(data.contents);
            })
            .catch(error => {
                document.getElementById('gantt_chart').innerHTML = 
                    `<p style="color:#e53e3e; text-align:center; padding: 40px;">
                        Erro ao carregar dados da planilha pública.<br>
                        <small>Verifique a conexão ou se a planilha está publicada na web.</small>
                    </p>`;
                console.error(error);
            });
    }

    function processarCSV(csvText) {
        // Divide o arquivo em linhas separadas
        const linhas = csvText.split(/\r?\n/);
        
        var dataTable = new google.visualization.DataTable();
        dataTable.addColumn('string', 'Task ID');
        dataTable.addColumn('string', 'Task Name');
        dataTable.addColumn('string', 'Resource');
        dataTable.addColumn('date', 'Start Date');
        dataTable.addColumn('date', 'End Date');
        dataTable.addColumn('number', 'Duration');
        dataTable.addColumn('number', 'Percent Complete');
        dataTable.addColumn('string', 'Dependencies');

        let idContador = 1;

        // Começa da linha 1 para pular os cabeçalhos (DIA INICIAL, DIA FINAL...)
        for (let i = 1; i < linhas.length; i++) {
            const linha = linhas[i].trim();
            if (!linha) continue;

            // Expressão regular para quebrar por vírgulas mantendo textos com aspas intactos
            const colunas = linha.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || linha.split(',');
            
            if (colunas.length < 4) continue;

            const limpar = (texto) => texto ? texto.replace(/^"|"$/g, '').trim() : '';
            
            const txtDataInic = limpar(colunas[0]); // Formato esperado: YYYY-MM-DD
            const txtDataFim = limpar(colunas[1]);  // Formato esperado: YYYY-MM-DD
            const categoria = limpar(colunas[2]);
            const evento = limpar(colunas[3]);

            const pStart = txtDataInic.split('-');
            const pEnd = txtDataFim.split('-');

            if (pStart.length === 3 && pEnd.length === 3) {
                // Mês no Javascript vai de 0 a 11, por isso o "- 1"
                const dataInicio = new Date(parseInt(pStart[0]), parseInt(pStart[1]) - 1, parseInt(pStart[2]));
                const dataFim = new Date(parseInt(pEnd[0]), parseInt(pEnd[1]) - 1, parseInt(pEnd[2]));

                dataTable.addRow([
                    'T' + idContador, 
                    evento,              
                    categoria,           
                    dataInicio,           
                    dataFim,             
                    null,                
                    0,                   
                    null                 
                ]);
                idContador++;
            }
        }

        const opcoesVisuais = {
            height: idContador * 38 + 60,
            gantt: {
                trackHeight: 35,
                barHeight: 22,
                percentEnabled: false,
                palette: [
                    { "color": "#3182ce", "dark": "#2b6cb0", "light": "#ebf8ff" }, // Azul
                    { "color": "#319795", "dark": "#2c7a7b", "light": "#e6fffa" }, // Teal
                    { "color": "#d69e2e", "dark": "#b7791f", "light": "#fefcbf" }, // Amarelo
                    { "color": "#805ad5", "dark": "#6b46c1", "light": "#faf5ff" }, // Roxo
                    { "color": "#38a169", "dark": "#2f855a", "light": "#f0fff4" }, // Verde
                    { "color": "#e53e3e", "dark": "#c53030", "light": "#fff5f5" }  // Vermelho
                ]
            }
        };

        const chart = new google.visualization.Gantt(document.getElementById('gantt_chart'));
        chart.draw(dataTable, opcoesVisuais);
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma de Atividades - PPGE</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7fafc;
            margin: 0;
            padding: 20px;
            color: #2d3748;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        h1 {
            text-align: center;
            color: #1a365d;
            margin-bottom: 5px;
            font-size: 26px;
        }
        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .gantt-scroll-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #fff;
        }
        #gantt_chart {
            min-width: 1100px;
            min-height: 400px;
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 16px;
            color: #a0aec0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Cronograma de Atividades PPGE</h1>
    <div class="subtitle">Gráfico de Gantt dinâmico atualizado via Google Sheets</div>
    
    <div class="gantt-scroll-container">
        <div id="gantt_chart">
            <div class="loading">Carregando e processando dados da agenda pública...</div>
        </div>
    </div>
</div>

<script type="text/javascript">
    google.charts.load('current', {'packages':['gantt'], 'language': 'pt-br'});
    google.charts.setOnLoadCallback(baixarDadosCSV);

    function baixarDadosCSV() {
        // ID público e definitivo da sua planilha da agenda
        const spreadsheetId = "11gYJqlhSULjWt6hAExmIyWKprE43uB7fybmx7osr-z8";
        
        // Link de exportação direta que ignora o delay do painel "Publicar na Web"
        const urlCSV = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/export?format=csv&gid=0`;

        fetch(urlCSV)
            .then(response => {
                if (!response.ok) throw new Error('Erro ao baixar a planilha.');
                return response.text();
            })
            .then(csvText => {
                processarCSV(csvText);
            })
            .catch(error => {
                document.getElementById('gantt_chart').innerHTML = 
                    `<p style="color:#e53e3e; text-align:center; padding: 40px;">
                        Erro ao carregar dados da planilha pública.<br>
                        <small>Certifique-se de que a planilha está configurada como "Qualquer pessoa com o link pode ler".</small>
                    </p>`;
                console.error(error);
            });
    }

    // Separa as colunas respeitando aspas e vírgulas gramaticais
    function parseCSV(text) {
        let lines = [];
        let row = [""];
        let inQuotes = false;

        // Remove o caractere BOM invisível se o Google Sheets tiver adicionado
        if (text.startsWith('\ufeff')) {
            text = text.substring(1);
        }

        for (let i = 0; i < text.length; i++) {
            let c = text[i];
            let next = text[i+1];

            if (c === '"') {
                if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
                else { inQuotes = !inQuotes; }
            } else if (c === ',' && !inQuotes) {
                row.push('');
            } else if ((c === '\r' || c === '\n') && !inQuotes) {
                if (c === '\r' && next === '\n') { i++; }
                lines.push(row);
                row = [''];
            } else {
                row[row.length - 1] += c;
            }
        }
        if (row.length > 1 || row[0] !== '') lines.push(row);
        return lines;
    }

    function converterParaData(stringData) {
        if (!stringData) return null;
        
        // Remove caracteres invisíveis (como espaços sem quebra ou \h) e aspas residuais
        stringData = stringData.replace(/[\u200B-\u200D\uFEFF]/g, "").replace(/^"|"$/g, '').trim();

        if (stringData.includes('-')) {
            const p = stringData.split('-');
            if (p.length === 3) {
                return new Date(parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2]));
            }
        }
        
        if (stringData.includes('/')) {
            const p = stringData.split('/');
            if (p.length === 3) {
                return new Date(parseInt(p[2]), parseInt(p[1]) - 1, parseInt(p[0]));
            }
        }

        return null;
    }

    function processarCSV(csvText) {
        const matrizDados = parseCSV(csvText);
        
        var dataTable = new google.visualization.DataTable();
        dataTable.addColumn('string', 'Task ID');
        dataTable.addColumn('string', 'Task Name');
        dataTable.addColumn('string', 'Resource');
        dataTable.addColumn('date', 'Start Date');
        dataTable.addColumn('date', 'End Date');
        dataTable.addColumn('number', 'Duration');
        dataTable.addColumn('number', 'Percent Complete');
        dataTable.addColumn('string', 'Dependencies');

        let idContador = 1;

        for (let i = 1; i < matrizDados.length; i++) {
            const colunas = matrizDados[i];
            if (colunas.length < 4) continue;

            const limpar = (texto) => texto ? texto.trim() : '';
            
            const txtDataInic = limpar(colunas[0]);
            const txtDataFim = limpar(colunas[1]);
            const categoria = limpar(colunas[2]);
            const evento = limpar(colunas[3]);

            if (txtDataInic.toUpperCase().includes("DIA") || evento.toUpperCase().includes("EVENTO") || !txtDataInic) continue;

            const dataInicio = converterParaData(txtDataInic);
            const dataFim = converterParaData(txtDataFim);

            if (dataInicio && !isNaN(dataInicio.getTime()) && dataFim && !isNaN(dataFim.getTime())) {
                dataTable.addRow([
                    'T' + idContador, 
                    evento,              
                    categoria,           
                    dataInicio,           
                    dataFim,             
                    null,                
                    0,                   
                    null                 
                ]);
                idContador++;
            }
        }

        if (idContador === 1) {
            document.getElementById('gantt_chart').innerHTML = 
                `<p style="text-align:center; padding:40px; color:#718096;">Nenhum dado pôde ser processado. Certifique-se de que a aba da planilha possui dados válidos.</p>`;
            return;
        }

        const alturaCalculada = (idContador * 42) + 60;
        document.getElementById('gantt_chart').style.height = alturaCalculada + 'px';

        const opcoesVisuais = {
            height: alturaCalculada,
            gantt: {
                trackHeight: 38,
                barHeight: 24,
                percentEnabled: false,
                palette: [
                    { "color": "#3182ce", "dark": "#2b6cb0", "light": "#ebf8ff" }, // Azul
                    { "color": "#319795", "dark": "#2c7a7b", "light": "#e6fffa" }, // Teal
                    { "color": "#d69e2e", "dark": "#b7791f", "light": "#fefcbf" }, // Amarelo
                    { "color": "#805ad5", "dark": "#6b46c1", "light": "#faf5ff" }, // Roxo
                    { "color": "#38a169", "dark": "#2f855a", "light": "#f0fff4" }, // Verde
                    { "color": "#e53e3e", "dark": "#c53030", "light": "#fff5f5" }  // Vermelho
                ]
            }
        };

        const chart = new google.visualization.Gantt(document.getElementById('gantt_chart'));
        chart.draw(dataTable, opcoesVisuais);
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINHA DO TEMPO CRONOLÓGICA - PPGE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* CONFIGURAÇÕES GERAIS - PADRONIZAÇÃO EM MAIÚSCULAS */
        * { box-sizing: border-box; }
        body {
            background-color: #F8FAFC;
            font-family: 'Lato', sans-serif;
            margin: 0;
            padding: 25px;
            text-transform: uppercase;
        }
        
        /* CONTAINER DE TELA CHEIA */
        .container {
            max-width: 98%;
            margin: 0 auto;
        }
        
        /* CABEÇALHO INTEGRADO */
        .header {
            background: linear-gradient(135deg, #003366 0%, #001A33 100%);
            color: white;
            padding: 25px 35px;
            border-radius: 12px;
            margin-bottom: 40px;
            border-left: 15px solid #FFCC00;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        .header h1 { margin: 0; font-family: 'Poppins'; font-size: 26px; font-weight: 700; }
        .header p { margin: 5px 0 0 0; color: #FFCC00; font-weight: 600; font-size: 11px; letter-spacing: 1px; }

        /* ESTRUTURA EIXO VERTICAL CRONOLÓGICO */
        .timeline-container {
            position: relative;
            padding-left: 45px; /* ESPAÇO PARA A LINHA VERTICAL */
            margin-top: 20px;
        }

        /* A LINHA VERTICAL MASTER */
        .timeline-container::before {
            content: '';
            position: absolute;
            left: 15px;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(to bottom, #003366 0%, #FFCC00 50%, #CBD5E1 100%);
            border-radius: 2px;
        }

        /* BLOCO DO DIA (AGRUPADOR NA LINHA) */
        .timeline-group {
            position: relative;
            margin-bottom: 35px;
            background: #FFF;
            border-radius: 12px;
            padding: 25px;
            border: 1px solid #E2E8F0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }

        /* BOLA MARCADA NA LINHA VERTICAL */
        .timeline-badge {
            position: absolute;
            left: -42px;
            top: 22px;
            width: 26px;
            height: 26px;
            background-color: #FFF;
            border: 4px solid #003366;
            border-radius: 50%;
            z-index: 5;
            transition: all 0.2s ease;
        }
        .timeline-group:hover .timeline-badge {
            background-color: #FFCC00;
            transform: scale(1.15);
        }

        /* ETIQUETA DA DATA DE INÍCIO */
        .timeline-date-label {
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #FFFFFF;
            background: #003366;
            padding: 6px 14px;
            border-radius: 6px;
            align-self: flex-start;
            margin-bottom: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* RAMIFICAÇÃO DAS OCORRÊNCIAS SIMULTÂNEAS (OCUPAM A LARGURA DA TELA) */
        .events-branch {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            width: 100%;
        }

        /* CARD DO EVENTO INDIVIDUAL */
        .event-bar {
            background: #F8FAFC;
            border-radius: 8px;
            padding: 18px;
            border: 1px solid #E2E8F0;
            border-left: 6px solid #003366;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* CORES DE IDENTIFICAÇÃO POR CATEGORIA */
        .cat-geral { border-left-color: #3182CE; }
        .cat-prazos { border-left-color: #E53E3E; }
        .cat-aulas { border-left-color: #38A169; }
        .cat-eventos { border-left-color: #805AD5; }
        .cat-secretaria { border-left-color: #D69E2E; }

        /* RELÓGIO POSICIONADO NO TOPO DO CARD */
        .event-time-top {
            font-size: 11px;
            color: #003366;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: #E2E8F0;
            padding: 4px 10px;
            border-radius: 4px;
            width: fit-content;
        }

        /* TÍTULO DO EVENTO */
        .event-title {
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: #1E293B;
            margin: 0 0 15px 0;
            line-height: 1.45;
        }

        /* METADADOS (RODAPÉ DO CARD) */
        .event-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            margin-top: auto;
        }

        .category-tag {
            background: #E2E8F0;
            padding: 3px 8px;
            border-radius: 4px;
            color: #475569;
        }

        /* LOCALIZADOR DA LINHA DA PLANILHA */
        .sheet-line-tag {
            background: #FFF5F5;
            color: #C53030;
            border: 1px solid #FEB2B2;
            padding: 3px 8px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ALERTA DE OCORRÊNCIAS SIMULTÂNEAS */
        .simultaneous-alert {
            background: #FFF9E6;
            border-left: 4px solid #FFCC00;
            color: #B7791F;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .loading { text-align: center; padding: 100px; color: #64748B; font-weight: 700; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1>LINHA DO TEMPO CRONOLÓGICA PPGE</h1>
            <p>PAINEL OPERACIONAL DE ATIVIDADES E OCORRÊNCIAS SIMULTÂNEAS</p>
        </div>
    </div>

    <div id="timeline" class="timeline-container">
        <div class="loading">CONSTRUINDO EIXO CRONOLÓGICO VERTICAL...</div>
    </div>
</div>

<script>
    async function renderizarLinhaTempo() {
        try {
            const resposta = await fetch('agenda.json');
            const eventos = await resposta.json();
            
            const container = document.getElementById('timeline');
            container.innerHTML = '';

            if(eventos.length === 0) {
                container.innerHTML = '<div class="loading">NENHUM DADO ENCONTRADO NO ARQUIVO AGENDA.JSON</div>';
                return;
            }

            // Ordenação Cronológica por data de início
            eventos.sort((a, b) => new Date(a["DIA INICIAL"]) - new Date(b["DIA INICIAL"]));

            // Agrupamento por data de início para detecção de simultaneidade
            const gruposDeData = {};
            eventos.forEach(evento => {
                const dataChave = evento["DIA INICIAL"];
                if (!gruposDeData[dataChave]) {
                    gruposDeData[dataChave] = [];
                }
                gruposDeData[dataChave].push(evento);
            });

            // Renderização no Eixo
            Object.keys(gruposDeData).forEach(dataChave => {
                const listaEventosDesteDia = gruposDeData[dataChave];
                const dataInicBR = dataChave.split('-').reverse().join('/');
                
                const grupoDiv = document.createElement('div');
                grupoDiv.className = 'timeline-group';

                let alertaSimultaneoHTML = '';
                if (listaEventosDesteDia.length > 1) {
                    alertaSimultaneoHTML = `
                        <div class="simultaneous-alert">
                            <i class="fa-solid fa-triangle-exclamation"></i> 
                            ${listaEventosDesteDia.length} ATIVIDADES SIMULTÂNEAS CONCORRENTES NESTE DIA
                        </div>
                    `;
                }

                let cardsHTML = '';
                listaEventosDesteDia.forEach(ev => {
                    const fimBR = ev["DIA FINAL"] ? ev["DIA FINAL"].split('-').reverse().join('/') : dataInicBR;
                    const exibicaoPeriodo = dataInicBR === fimBR ? dataInicBR : `${dataInicBR} ATÉ ${fimBR}`;
                    
                    let classeCor = 'cat-geral';
                    const catTexto = String(ev["CATEGORIA"] || ev["Categoria"] || '').toUpperCase();
                    if (catTexto.includes('AULA') || catTexto.includes('DISCIPLINA')) classeCor = 'cat-aulas';
                    else if (catTexto.includes('PRAZO') || catTexto.includes('EDITAL')) classeCor = 'cat-prazos';
                    else if (catTexto.includes('SECRETARIA') || catTexto.includes('MATRICULA')) classeCor = 'cat-secretaria';
                    else if (catTexto.includes('EVENTO') || catTexto.includes('SEMANA')) classeCor = 'cat-eventos';

                    const numLinha = ev["LINHA_PLANILHA"] || '?';

                    cardsHTML += `
                        <div class="event-bar ${classeCor}">
                            <div class="event-time-top">
                                <i class="fa-regular fa-clock"></i> PERÍODO: ${exibicaoPeriodo}
                            </div>
                            
                            <h2 class="event-title">${ev["EVENTO"]}</h2>
                            
                            <div class="event-meta">
                                <span class="category-tag"><i class="fa-solid fa-tag"></i> ${catTexto || 'GERAL'}</span>
                                <span class="sheet-line-tag"><i class="fa-solid fa-table"></i> LINHA: ${numLinha}</span>
                            </div>
                        </div>
                    `;
                });

                grupoDiv.innerHTML = `
                    <div class="timeline-badge"></div>
                    <div class="timeline-date-label"><i class="fa-solid fa-calendar-days"></i> INÍCIO: ${dataInicBR}</div>
                    ${alertaSimultaneoHTML}
                    <div class="events-branch">
                        ${cardsHTML}
                    </div>
                `;

                container.appendChild(grupoDiv);
            });

        } catch (erro) {
            document.getElementById('timeline').innerHTML = `
                <div class="loading" style="color: #E53E3E;">
                    ERRO AO PROCESSAR PAINEL CRONOLÓGICO.
                </div>
            `;
            console.error(erro);
        }
    }

    renderizarLinhaTempo();
</script>

</body>
</html>

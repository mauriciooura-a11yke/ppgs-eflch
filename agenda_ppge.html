<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRONOGRAMA ESTRATÉGICO - PPGE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #E2E8F0;
            font-family: 'Lato', sans-serif;
            margin: 0;
            padding: 0;
            text-transform: uppercase;
            display: flex; /* ATIVA O LAYOUT LADO A LADO */
            min-height: 100vh;
        }
        
        /* SIDEBAR FIXA À ESQUERDA */
        .sidebar {
            width: 320px;
            background-color: #001A33;
            color: white;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            overflow-y: auto;
            z-index: 10;
        }

        .sidebar-title {
            font-family: 'Poppins';
            font-size: 18px;
            font-weight: 700;
            color: #FFCC00;
            margin: 0;
            border-bottom: 2px solid #FFCC00;
            padding-bottom: 10px;
            letter-spacing: 1px;
        }

        /* ÁREA PRINCIPAL DE CONTEÚDO (DIREITA) */
        .main-content {
            margin-left: 320px; /* ABRE ESPAÇO PARA A SIDEBAR DO LADO */
            flex-grow: 1;
            padding: 30px;
        }
        
        .header {
            background: linear-gradient(135deg, #003366 0%, #001A33 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 8px;
            margin-bottom: 25px;
            border-left: 12px solid #FFCC00;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }
        .header h1 { margin: 0; font-family: 'Poppins'; font-size: 24px; font-weight: 700; }
        .header p { margin: 5px 0 0 0; color: #FFCC00; font-weight: 600; font-size: 11px; letter-spacing: 1px; }

        /* GRUPOS DE FILTROS NA SIDEBAR */
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .filter-group label {
            font-size: 11px;
            font-weight: 700;
            color: #94A3B8;
            letter-spacing: 0.5px;
        }

        /* CAIXA DE TEXTO DA SIDEBAR */
        .filter-input {
            padding: 12px;
            border: 1px solid #334155;
            border-radius: 6px;
            font-family: 'Lato';
            font-size: 13px;
            text-transform: uppercase;
            width: 100%;
            background-color: #0f172a;
            color: white;
        }
        .filter-input:focus {
            outline: none;
            border-color: #FFCC00;
        }
        
        /* BOTÕES ESTILO TAG SELECIONÁVEL (SAI O CTRL + MOUSE) */
        .tag-selector-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .tag-button {
            background-color: #1E293B;
            border: 1px solid #334155;
            color: #94A3B8;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .tag-button:hover {
            background-color: #334155;
            color: white;
        }
        /* ESTADO QUANDO A TAG ESTÁ ATIVA/SELECIONADA */
        .tag-button.active {
            background-color: #FFCC00;
            color: #001A33;
            border-color: #FFCC00;
        }
        .tag-button i {
            font-size: 10px;
            opacity: 0.7;
        }

        .btn-reset {
            margin-top: 10px;
            padding: 12px;
            background-color: #EF4444;
            color: white;
            border: none;
            border-radius: 6px;
            font-family: 'Poppins';
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-reset:hover { background-color: #DC2626; }

        /* TIMELINE GRÁFICA GANTT */
        .gantt-timeline {
            position: relative;
            background: #FFF;
            border: 2px solid #1E293B;
            border-radius: 12px;
            padding: 10px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .gantt-timeline::before {
            content: '';
            position: absolute;
            left: 140px;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #003366;
            z-index: 1;
        }

        .gantt-row {
            display: flex;
            align-items: center;
            position: relative;
            min-height: 105px;
            padding: 20px 20px 20px 0;
            border-bottom: 4px solid #1E293B;
        }
        .gantt-row:nth-child(even) {
            background-color: #F8FAFC;
        }
        .gantt-row:last-child {
            border-bottom: none;
        }

        .gantt-date-side {
            width: 120px;
            font-family: 'Poppins';
            font-size: 13px;
            font-weight: 700;
            color: #003366;
            text-align: right;
            padding-right: 15px;
            flex-shrink: 0;
            z-index: 2;
        }

        .gantt-node {
            position: absolute;
            left: 135px;
            width: 14px;
            height: 14px;
            background: #FFCC00;
            border: 3px solid #003366;
            border-radius: 50%;
            z-index: 3;
        }

        .gantt-space {
            margin-left: 35px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            z-index: 2;
        }

        .event-card-horizontal {
            background: #FFF;
            border: 1px solid #CBD5E1;
            border-left: 8px solid #3182CE;
            border-radius: 6px;
            padding: 14px 18px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 290px; 
            transition: all 0.2s;
        }

        .card-status-past {
            border: 2px solid #C53030 !important;
            border-left: 12px solid #C53030 !important;
            background: #FFF5F5 !important;
            box-shadow: 0 4px 12px rgba(197, 48, 48, 0.15) !important;
        }

        .border-geral { border-left-color: #3182CE; }
        .border-prazos { border-left-color: #E53E3E; }
        .border-aulas { border-left-color: #38A169; }
        .border-eventos { border-left-color: #805AD5; }
        .border-secretaria { border-left-color: #D69E2E; }

        .card-top-time {
            font-size: 11px;
            color: #003366;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .badge-status-alert {
            background-color: #C53030;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .card-title {
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #1E293B;
            margin: 0 0 10px 0;
            line-height: 1.4;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            font-weight: 700;
        }

        .tag-category {
            background: #E2E8F0;
            padding: 2px 6px;
            border-radius: 3px;
            color: #475569;
        }

        .tag-line {
            background: #FFF5F5;
            color: #C53030;
            border: 1px solid #FEB2B2;
            padding: 2px 6px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .loading { text-align: center; padding: 60px; color: #64748B; font-weight: 700; width: 100%; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2 class="sidebar-title"><i class="fa-solid fa-sliders"></i> PAINEL FILTROS</h2>
    
    <div class="filter-group">
        <label><i class="fa-solid fa-magnifying-glass"></i> BUSCAR PALAVRA-CHAVE</label>
        <input type="text" id="filter-search" class="filter-input" placeholder="DIGITE O TERMO..." oninput="filtrarCronograma()">
    </div>
    
    <div class="filter-group">
        <label><i class="fa-solid fa-tags"></i> FILTRAR CATEGORIAS</label>
        <div id="container-tags-categoria" class="tag-selector-container">
            </div>
    </div>
    
    <div class="filter-group">
        <label><i class="fa-solid fa-hourglass-half"></i> STATUS TEMPORAL</label>
        <div class="tag-selector-container">
            <button id="btn-status-ativos" class="tag-button active" onclick="toggleStatusTag('ATIVOS')">
                <span>🚨 ANDAMENTO / ANTERIORES</span> <i class="fa-solid fa-check"></i>
            </button>
            <button id="btn-status-futuros" class="tag-button active" onclick="toggleStatusTag('FUTUROS')">
                <span>📅 ATIVIDADES FUTURAS</span> <i class="fa-solid fa-check"></i>
            </button>
        </div>
    </div>
    
    <button class="btn-reset" onclick="limparFiltros()">
        <i class="fa-solid fa-filter-circle-xmark"></i> LIMPAR TODOS OS FILTROS
    </button>
</div>

<div class="main-content">
    <div class="header">
        <h1>CRONOGRAMA INTEGRADO PPGE</h1>
        <p>ARQUITETURA EM SIDEBAR AVANÇADA COM GERENCIAMENTO MULTISELECT POR TAGS DINÂMICAS</p>
    </div>

    <div id="gantt-container" class="gantt-timeline">
        <div class="loading">CONSTRUINDO RAIA CRONOLÓGICA PROPORCIONAL...</div>
    </div>
</div>

<script>
    let datasetCompleto = [];
    let categoriasSelecionadas = [];
    let statusSelecionados = ['ATIVOS', 'FUTUROS'];

    function normalizarString(txt) {
        return String(txt || '').toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    function obterDataHoje() {
        const hoje = new Date();
        hoje.setHours(0, 0, 0, 0);
        return hoje;
    }

    async function inicializar() {
        try {
            const r = await fetch('agenda_ppge.json?t=' + new Date().getTime());
            const dadosBrutos = await r.json();
            
            // Remove itens concluídos
            datasetCompleto = dadosBrutos.filter(ev => {
                const statusConclusao = String(ev["CONCLUIDO"] || '').toUpperCase().trim();
                return statusConclusao !== "SIM";
            });
            
            datasetCompleto.sort((a, b) => new Date(a["DIA INICIAL"]) - new Date(b["DIA INICIAL"]));
            
            mapearCategoriasIniciais();
            filtrarCronograma();
        } catch (e) {
            document.getElementById('gantt-container').innerHTML = `<div class="loading" style="color: red;">ERRO AO CARREGAR BASE JSON DA AGENDA.</div>`;
        }
    }

    // Cria as tags de categoria na sidebar com base nas ocorrências do JSON
    function mapearCategoriasIniciais() {
        const container = document.getElementById('container-tags-categoria');
        container.innerHTML = '';
        const list = new Set();
        
        datasetCompleto.forEach(ev => {
            const c = String(ev["CATEGORIA"] || 'GERAL').toUpperCase().trim();
            if(c) list.add(c);
        });

        categoriasSelecionadas = Array.from(list).sort();

        categoriasSelecionadas.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'tag-button active';
            btn.id = `btn-cat-${cat.replace(/\s+/g, '-')}`;
            btn.innerHTML = `<span>${cat}</span> <i class="fa-solid fa-check"></i>`;
            btn.onclick = () => toggleCategoriaTag(cat, btn.id);
            container.appendChild(btn);
        });
    }

    // Gerencia o clique simples nas tags de Categoria
    function toggleCategoriaTag(cat, elementId) {
        const btn = document.getElementById(elementId);
        if (categoriasSelecionadas.includes(cat)) {
            categoriasSelecionadas = categoriasSelecionadas.filter(c => c !== cat);
            btn.classList.remove('active');
            btn.querySelector('i').className = 'fa-solid fa-minus';
        } else {
            categoriasSelecionadas.push(cat);
            btn.classList.add('active');
            btn.querySelector('i').className = 'fa-solid fa-check';
        }
        filtrarCronograma();
    }

    // Gerencia o clique simples nas tags de Status Temporal
    function toggleStatusTag(status) {
        const btn = document.getElementById(`btn-status-${status.toLowerCase()}`);
        if (statusSelecionados.includes(status)) {
            statusSelecionados = statusSelecionados.filter(s => s !== status);
            btn.classList.remove('active');
            btn.querySelector('i').className = 'fa-solid fa-minus';
        } else {
            statusSelecionados.push(status);
            btn.classList.add('active');
            btn.querySelector('i').className = 'fa-solid fa-check';
        }
        filtrarCronograma();
    }

    function filtrarCronograma() {
        const bSel = normalizarString(document.getElementById('filter-search').value);
        const hojeTime = obterDataHoje();

        const dadosFiltrados = datasetCompleto.filter(ev => {
            const cEv = String(ev["CATEGORIA"] || 'GERAL').toUpperCase().trim();
            const nEv = normalizarString(ev["EVENTO"]);
            const dataEvInic = new Date(ev["DIA INICIAL"]);
            dataEvInic.setHours(0,0,0,0);

            // Filtro por Tags de Categoria
            const bateCategoria = categoriasSelecionadas.includes(cEv);
            
            // Filtro por Tags de Status Temporal
            const ehAtivo = dataEvInic <= hojeTime;
            let bateStatus = false;
            if (statusSelecionados.includes('ATIVOS') && ehAtivo) bateStatus = true;
            if (statusSelecionados.includes('FUTUROS') && !ehAtivo) bateStatus = true;

            // Filtro por Busca Textual
            const bateBusca = (!bSel || nEv.includes(bSel) || cEv.includes(bSel));

            return bateCategoria && bateStatus && bateBusca;
        });

        renderizarGanttEstendido(dadosFiltrados);
    }

    function limparFiltros() {
        document.getElementById('filter-search').value = '';
        
        // Reativa todas as tags de Categoria
        categoriasSelecionadas = [];
        document.querySelectorAll('#container-tags-categoria .tag-button').forEach(btn => {
            btn.classList.add('active');
            btn.querySelector('i').className = 'fa-solid fa-check';
            const catText = btn.querySelector('span').innerText;
            categoriasSelecionadas.push(catText);
        });

        // Reativa todas as tags de Status
        statusSelecionados = ['ATIVOS', 'FUTUROS'];
        document.querySelectorAll('[id^="btn-status-"]').forEach(btn => {
            btn.classList.add('active');
            btn.querySelector('i').className = 'fa-solid fa-check';
        });

        filtrarCronograma();
    }

    function renderizarGanttEstendido(eventos) {
        const container = document.getElementById('gantt-container');
        container.innerHTML = '';

        if(eventos.length === 0) {
            container.innerHTML = '<div class="loading">NENHUMA ATIVIDADE ATENDE AOS CRITÉRIOS DE SELEÇÃO ATIVOS.</div>';
            return;
        }

        const datasChave = Array.from(new Set(eventos.map(e => e["DIA INICIAL"]))).sort();
        const hojeTime = obterDataHoje();

        datasChave.forEach(dataFoco => {
            const dataExibicaoBR = dataFoco.split('-').reverse().join('/');
            const eventosDaRaia = eventos.filter(e => e["DIA INICIAL"] === dataFoco);

            if(eventosDaRaia.length === 0) return;

            const row = document.createElement('div');
            row.className = 'gantt-row';

            const dateSide = document.createElement('div');
            dateSide.className = 'gantt-date-side';
            dateSide.innerText = dataExibicaoBR;
            row.appendChild(dateSide);

            const node = document.createElement('div');
            node.className = 'gantt-node';
            row.appendChild(node);

            const space = document.createElement('div');
            space.className = 'gantt-space';

            eventosDaRaia.forEach(ev => {
                const iBR = ev["DIA INICIAL"].split('-').reverse().join('/');
                const fBR = ev["DIA FINAL"] ? ev["DIA FINAL"].split('-').reverse().join('/') : iBR;
                const textoPeriodo = iBR === fBR ? iBR : `${iBR} ATÉ ${fBR}`;

                const dInic = new Date(ev["DIA INICIAL"]);
                const dFim = new Date(ev["DIA FINAL"] || ev["DIA INICIAL"]);
                const diferencaDias = Math.max(1, Math.round((dFim - dInic) / (1000 * 60 * 60 * 24)) + 1);
                
                const larguraCalculada = Math.min(100, 25 + (diferencaDias * 3)); 

                const dInicComparacao = new Date(ev["DIA INICIAL"]);
                dInicComparacao.setHours(0,0,0,0);
                const ehPassadoOuAtual = dInicComparacao <= hojeTime;

                let classeBorda = 'border-geral';
                const cat = String(ev["CATEGORIA"] || 'GERAL').toUpperCase();
                if (cat.includes('AULA') || cat.includes('DISCIPLINA')) classeBorda = 'border-aulas';
                else if (cat.includes('PRAZO') || cat.includes('EDITAL')) classeBorda = 'border-prazos';
                else if (cat.includes('SECRETARIA') || cat.includes('MATRICULA')) classeBorda = 'border-secretaria';
                else if (cat.includes('EVENTO') || cat.includes('SEMANA')) classeBorda = 'border-eventos';

                const card = document.createElement('div');
                card.className = `event-card-horizontal ${classeBorda}`;
                card.style.width = `${larguraCalculada}%`; 

                let statusBadgeHTML = '';
                if(ehPassadoOuAtual) {
                    card.classList.add('card-status-past');
                    statusBadgeHTML = `<span class="badge-status-alert"><i class="fa-solid fa-triangle-exclamation"></i> VIGENTE / ANTERIOR</span>`;
                }

                const nLinha = ev["LINHA_PLANILHA"] || '...';

                card.innerHTML = `
                    <div class="card-top-time">
                        <span><i class="fa-regular fa-clock"></i> ${textoPeriodo} (${diferencaDias}D)</span>
                        ${statusBadgeHTML}
                    </div>
                    <h2 class="card-title">${ev["EVENTO"]}</h2>
                    <div class="card-footer">
                        <span class="tag-category"><i class="fa-solid fa-tag"></i> ${cat}</span>
                        <span class="tag-line"><i class="fa-solid fa-table"></i> L: ${nLinha}</span>
                    </div>
                `;
                space.appendChild(card);
            });

            row.appendChild(space);
            container.appendChild(row);
        });
    }

    window.onload = inicializar;
</script>

</body>
</html>
